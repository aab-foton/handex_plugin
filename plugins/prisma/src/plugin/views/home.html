<!-- VIEW: HOME -->
<main id="view-home" class="view active px-5 py-5 flex flex-col h-full overflow-y-auto">

  <div class="mb-4">
    <h2 class="text-[#1E293B] dark:text-white font-extrabold text-[14px] tracking-tight">Auditoria de Maturidade UX</h2>
    <p class="text-slate-400 dark:text-dark-muted text-[10px] mt-0.5">Selecione uma ferramenta para começar.</p>
  </div>

  <!-- Cards -->
  <div class="grid grid-cols-2 gap-2.5 w-full">

    <!-- Briefing -->
    <button onclick="navigate('view-briefing')" aria-label="Briefing do Projeto"
      class="flex flex-col items-start gap-2 p-3.5 bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-blue-300 hover:bg-blue-50/40 dark:hover:bg-slate-800 rounded-2xl shadow-sm transition-all focus:ring-2 focus:ring-blue-300/30 outline-none text-left relative">
      <div class="w-8 h-8 flex items-center justify-center bg-blue-50 dark:bg-blue-900/20 rounded-xl shrink-0">
        <i data-lucide="clipboard-list" class="w-4 h-4 text-blue-600 dark:text-blue-400" aria-hidden="true"></i>
      </div>
      <div class="min-w-0">
        <p class="font-extrabold text-[11.5px] tracking-tight text-slate-800 dark:text-white leading-tight">Briefing</p>
        <p class="text-[10px] text-slate-400 dark:text-dark-muted mt-0.5 leading-tight">Contexto e objetivos</p>
      </div>
      <span id="badge-briefing" class="hidden absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-blue-500"></span>
    </button>

    <!-- Frameworks -->
    <button onclick="navigateToFrameworks()" aria-label="Frameworks de UX"
      class="flex flex-col items-start gap-2 p-3.5 bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-violet-200 dark:hover:border-violet-800 hover:bg-violet-50/40 dark:hover:bg-slate-800 rounded-2xl shadow-sm transition-all focus:ring-2 focus:ring-violet-300/30 outline-none text-left relative">
      <div class="w-8 h-8 flex items-center justify-center bg-violet-50 dark:bg-violet-900/20 rounded-xl shrink-0">
        <i data-lucide="layout-template" class="w-4 h-4 text-violet-500 dark:text-violet-400" aria-hidden="true"></i>
      </div>
      <div class="min-w-0">
        <p class="font-extrabold text-[11.5px] tracking-tight text-slate-800 dark:text-white leading-tight">Frameworks</p>
        <p class="text-[10px] text-slate-400 dark:text-dark-muted mt-0.5 leading-tight">O que já está no canvas</p>
      </div>
      <span id="badge-frameworks" class="hidden absolute top-2 right-2 min-w-[16px] h-4 px-1 bg-violet-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center"></span>
    </button>

    <!-- Auditoria de Maturidade -->
    <button onclick="navigateToAudit()" aria-label="Auditoria de Maturidade"
      class="flex flex-col items-start gap-2 p-3.5 bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-indigo-300 hover:bg-indigo-50/40 dark:hover:bg-slate-800 rounded-2xl shadow-sm transition-all focus:ring-2 focus:ring-indigo-300/30 outline-none text-left relative">
      <div class="w-8 h-8 flex items-center justify-center bg-indigo-50 dark:bg-indigo-900/20 rounded-xl shrink-0">
        <i data-lucide="clipboard-check" class="w-4 h-4 text-indigo-600 dark:text-indigo-400" aria-hidden="true"></i>
      </div>
      <div class="min-w-0">
        <p class="font-extrabold text-[11.5px] tracking-tight text-slate-800 dark:text-white leading-tight">Auditoria</p>
        <p class="text-[10px] text-slate-400 dark:text-dark-muted mt-0.5 leading-tight">Evidências de processo</p>
      </div>
      <span id="badge-audit" class="hidden absolute top-2 right-2 min-w-[16px] h-4 px-1 bg-indigo-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center"></span>
    </button>

    <!-- Teste de Usabilidade -->
    <button onclick="navigateToUsabilityTests()" aria-label="Teste de Usabilidade"
      class="flex flex-col items-start gap-2 p-3.5 bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-teal-300 hover:bg-teal-50/40 dark:hover:bg-slate-800 rounded-2xl shadow-sm transition-all focus:ring-2 focus:ring-teal-300/30 outline-none text-left relative">
      <div class="w-8 h-8 flex items-center justify-center bg-teal-50 dark:bg-teal-900/20 rounded-xl shrink-0">
        <i data-lucide="users-round" class="w-4 h-4 text-teal-600 dark:text-teal-400" aria-hidden="true"></i>
      </div>
      <div class="min-w-0">
        <p class="font-extrabold text-[11.5px] tracking-tight text-slate-800 dark:text-white leading-tight">Teste de Usabilidade</p>
        <p class="text-[10px] text-slate-400 dark:text-dark-muted mt-0.5 leading-tight">Planejar, rodar e analisar</p>
      </div>
      <span id="badge-usability-test" class="hidden absolute top-2 right-2 min-w-[16px] h-4 px-1 bg-teal-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center"></span>
    </button>

    <!-- Score & IA -->
    <button onclick="navigateToScore()" aria-label="Score de Maturidade"
      class="flex flex-col items-start gap-2 p-3.5 bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-amber-300 hover:bg-amber-50/40 dark:hover:bg-slate-800 rounded-2xl shadow-sm transition-all focus:ring-2 focus:ring-amber-300/30 outline-none text-left relative">
      <div class="w-8 h-8 flex items-center justify-center bg-amber-50 dark:bg-amber-900/20 rounded-xl shrink-0">
        <i data-lucide="sparkles" class="w-4 h-4 text-amber-500 dark:text-amber-400" aria-hidden="true"></i>
      </div>
      <div class="min-w-0">
        <p class="font-extrabold text-[11.5px] tracking-tight text-slate-800 dark:text-white leading-tight">Score & IA</p>
        <p class="text-[10px] text-slate-400 dark:text-dark-muted mt-0.5 leading-tight">Pontuação de maturidade</p>
      </div>
      <span id="badge-score" class="hidden absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-amber-500"></span>
      <span id="badge-score-mock" class="hidden absolute top-2 right-2 px-1.5 py-0.5 bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 text-[8px] font-extrabold uppercase tracking-wide rounded-full">simulado</span>
    </button>

    <!-- Guia -->
    <button onclick="navigate('view-guide')" aria-label="Guia de uso"
      class="flex flex-col items-start gap-2 p-3.5 bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-slate-300 hover:bg-slate-50/60 dark:hover:bg-slate-800 rounded-2xl shadow-sm transition-all focus:ring-2 focus:ring-slate-300/30 outline-none text-left">
      <div class="w-8 h-8 flex items-center justify-center bg-gray-50 dark:bg-slate-700 rounded-xl shrink-0">
        <i data-lucide="book-open" class="w-4 h-4 text-slate-500 dark:text-slate-300" aria-hidden="true"></i>
      </div>
      <div class="min-w-0">
        <p class="font-extrabold text-[11.5px] tracking-tight text-slate-800 dark:text-white leading-tight">Guia</p>
        <p class="text-[10px] text-slate-400 dark:text-dark-muted mt-0.5 leading-tight">Como usar o plugin</p>
      </div>
    </button>

  </div>

  <!-- CTA Exportar -->
  <div class="mt-auto pt-5">
    <button onclick="openExportModal()"
      class="w-full py-3 bg-[#2563eb] hover:bg-[#1d4ed8] text-white text-[13px] font-extrabold rounded-2xl transition-colors flex items-center justify-center gap-2 shadow-sm">
      <i data-lucide="download" class="w-4 h-4" aria-hidden="true"></i>
      Exportar Dados
    </button>
    <p class="text-[10px] text-slate-400 dark:text-dark-muted text-center mt-2 leading-tight">
      <i data-lucide="info" class="w-3 h-3 inline-block mr-1 opacity-70" aria-hidden="true"></i>
      Escolha entre o JSON completo do projeto ou o formato achatado para Power BI.
    </p>
    <p id="export-mock-warning" class="hidden text-[10px] text-amber-600 dark:text-amber-400 text-center mt-1.5 leading-tight">
      <i data-lucide="flask-conical" class="w-3 h-3 inline-block mr-1 opacity-80" aria-hidden="true"></i>
      O score incluso neste export ainda é simulado — consulte o campo "fonte" no JSON antes de compartilhar externamente.
    </p>
  </div>

</main>
