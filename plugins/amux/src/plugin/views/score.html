<!-- VIEW: SCORE & IA -->
<main id="view-score" class="view px-5 py-5 flex flex-col h-full overflow-y-auto">

  <!-- Header da view -->
  <div class="flex items-center gap-3 mb-4">
    <button onclick="navigate('view-home')" class="p-1.5 hover:bg-gray-100 dark:hover:bg-dark-surface rounded-lg transition-colors text-slate-400" aria-label="Voltar">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
    </button>
    <div>
      <h2 class="text-[#1E293B] dark:text-white font-extrabold text-[14px] tracking-tight">Score & IA</h2>
      <p class="text-slate-400 dark:text-dark-muted text-[10px]">Pontuação de maturidade UX gerada a partir do briefing, evidências e auditoria</p>
    </div>
  </div>

  <!-- Card de resultado -->
  <div class="bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line rounded-2xl p-5 text-center space-y-2">
    <div id="score-stars" class="flex items-center justify-center gap-1"></div>
    <p id="score-numeric" class="text-[20px] font-extrabold text-slate-800 dark:text-white">—</p>
    <p class="text-[10px] text-slate-400 dark:text-dark-muted">Maturidade de UX (0–100)</p>
  </div>

  <!-- Status da análise -->
  <div class="mt-4 flex items-center justify-center gap-2" id="ai-status">
    <i data-lucide="sparkles" class="w-4 h-4 text-slate-400"></i>
    <span class="text-[12px] font-bold text-slate-400">Pronto para analisar</span>
  </div>

  <button id="btn-run-ai" onclick="runAiAnalysis()"
    class="mt-4 w-full py-2.5 bg-[#2563eb] hover:bg-[#1d4ed8] text-white text-[13px] font-extrabold rounded-xl transition-colors flex items-center justify-center gap-2">
    <i data-lucide="sparkles" class="w-4 h-4"></i>
    Analisar com IA
  </button>
  <p class="text-[10px] text-slate-400 dark:text-dark-muted text-center mt-2 leading-tight">
    <i data-lucide="info" class="w-3 h-3 inline-block mr-1 opacity-70" aria-hidden="true"></i>
    A análise usa o briefing, as evidências das 4 etapas e a auditoria declarada de Design System/Acessibilidade.
  </p>

  <!-- Breakdown por dimensão -->
  <div class="mt-5 pt-4 border-t border-gray-100 dark:border-dark-line">
    <p class="text-[10px] font-bold text-slate-400 dark:text-dark-muted uppercase tracking-wide mb-2.5">Detalhamento por dimensão</p>
    <div id="score-breakdown" class="space-y-2"></div>
  </div>

</main>
