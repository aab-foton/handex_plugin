<!-- VIEW: FRAMEWORKS -->
<main id="view-frameworks" class="view px-5 py-5 flex flex-col h-full overflow-y-auto">

  <!-- Header da view -->
  <div class="flex items-center gap-3 mb-4">
    <button onclick="navigate('view-home')" class="p-1.5 hover:bg-gray-100 dark:hover:bg-dark-surface rounded-lg transition-colors text-slate-400" aria-label="Voltar">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
    </button>
    <div class="flex-1 min-w-0">
      <h2 class="text-[#1E293B] dark:text-white font-extrabold text-[14px] tracking-tight">Frameworks de UX</h2>
      <p class="text-slate-400 dark:text-dark-muted text-[10px]">O que já está no canvas — escaneado automaticamente</p>
    </div>
    <button onclick="openInsertFrameworkModal()"
      class="shrink-0 flex items-center gap-1.5 px-3 py-2 bg-[#2563eb] hover:bg-[#1d4ed8] text-white text-[11px] font-bold rounded-xl transition-colors">
      <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
      Inserir
    </button>
  </div>

  <!-- Busca entre os frameworks já injetados no canvas -->
  <div class="mb-3">
    <input id="instance-filter" type="text" placeholder="Buscar entre os frameworks injetados..." oninput="filterFrameworkInstances()" class="w-full" />
  </div>

  <!-- Sugestões de evidência (frameworks escaneados ainda não anexados à Auditoria) -->
  <div id="evidence-suggestions" class="hidden"></div>

  <!-- Instâncias já no canvas -->
  <div id="scanned-instances" class="space-y-3"></div>

  <!-- Reescanear — só aparece depois do primeiro scan -->
  <div class="pt-4 mt-auto">
    <button onclick="scanAll()" id="btn-rescan" class="hidden w-full py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-600 dark:text-dark-muted text-[11px] font-bold rounded-xl transition-colors items-center justify-center gap-1.5">
      <i data-lucide="scan-line" class="w-3.5 h-3.5"></i>
      Reescanear
    </button>
  </div>

</main>
