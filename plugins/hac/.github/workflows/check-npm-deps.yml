# Equivalente do check-npm-deps.yml do Handex, portado pro repositório
# PRÓPRIO do hac (hac_plugin) — 2026-09-22, pedido do usuário: "temos isso
# aqui no hac?" — não tinha. Mesma arquitetura: atualiza dependências
# dentro dos ranges semver já declarados em package.json (nunca bump de
# major sozinho), valida com lint + bundle, e abre PR pra revisão humana —
# nunca push direto em main. Mesmo racional de já rodar via GitHub Actions
# (não GitLab CI) documentado em refresh-dsc-refs.yml/notify-hac-refs-update.yml
# desta mesma pasta: runners hospedados do GitHub não dependem de nenhuma
# máquina pessoal, e GITHUB_TOKEN é gerado automaticamente pelo runner, sem
# precisar cadastrar secret novo.
#
# Este arquivo vive dentro de plugins/hac/ (não na raiz do monorepo) —
# publicado via `git subtree push --prefix=plugins/hac hac_plugin main`
# para aab-foton/hac_plugin, onde este arquivo efetivamente roda como raiz
# do repositório (sem prefixo plugins/hac, que só existe no monorepo) —
# mesmo padrão já usado por refresh-dsc-refs.yml/notify-hac-refs-update.yml.
name: check-npm-deps

on:
  schedule:
    - cron: "0 6 1 * *" # dia 1 de cada mes, 06:00 UTC
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  check-npm-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualiza dependencias dentro dos ranges declarados
        run: |
          npm install --no-audit --no-fund
          npm update --no-audit --no-fund

      - name: Lista pacotes com major disponivel (nao aplicado, so informativo)
        run: npm outdated || true

      - name: Verifica se algo mudou
        id: diff
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstroi artefatos e valida
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run lint
          npm run bundle:code
          npm run bundle:ui
        # export:plugin nao roda aqui: copia para hac-plugin/, pasta
        # gitignored que nao existe num checkout limpo de CI (so existe nas
        # maquinas locais de quem builda manualmente) e cujo conteudo nunca
        # e commitado por este workflow de qualquer forma.

      - name: Abre PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "hac-bot@users.noreply.github.com"
          git config user.name "hac Deps Bot"
          BRANCH="bot/npm-deps-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          # _skeleton.json (diferente do Handex) NÃO entra aqui: no hac ele é
          # gerado só a partir dos dados já existentes em src/plugin/refs/
          # (buscados pelo refresh-dsc-refs.yml, workflow separado) — uma
          # atualização de dependências npm nunca deveria alterá-lo.
          git add package.json package-lock.json src/plugin/code.bundle.js src/plugin/ui.html
          git commit -m "chore(hac/deps): atualiza dependencias dentro dos ranges declarados ($(date -u +%Y-%m-%d))"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(hac/deps): atualização de dependências — $(date -u +%Y-%m-%d)" \
            --body "Atualização automática de dependências do hac, dentro dos ranges semver já declarados em \`package.json\` (sem bump de major). Ver o log deste workflow (\"Lista pacotes com major disponivel\") para o que precisa de decisão manual. Revisar (\`npm run lint\` já rodou aqui) e aprovar se OK." \
            --base main \
            --head "$BRANCH"
