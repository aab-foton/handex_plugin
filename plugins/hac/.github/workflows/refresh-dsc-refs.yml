# Equivalente do refresh-dsc-skeleton.yml do Handex, adaptado pro
# repositório PRÓPRIO do hac (hac_plugin) — 2026-08-25. Mesma arquitetura:
# busca style/component keys das libs DSC via REST API do Figma, regenera
# o skeleton + os mapeamentos DSC→a11y, e abre PR pra revisão humana —
# nunca push direto em main.
#
# Diferente do Handex, o hac busca QUATRO libs DSC (web-angular-react,
# super-app, super-dsc-web, dsc-android — ver src/plugin/refs/_manifest.json)
# e regenera os QUATRO mapeamentos de a11y correspondentes
# (dsc-component-a11y-mapping.json para web-angular-react,
# dsc-component-a11y-mapping-mobile.json para super-app/React Native,
# dsc-component-a11y-mapping-superdscweb.json para super-dsc-web,
# dsc-component-a11y-mapping-android.json para dsc-android — atualizado em
# 2026-09-09, ver docs/auditoria-2026-09.html, seção 4/9; nomes de arquivo
# confirmados em LIB_MAPPING_FILES de build-dsc-structural-candidates.cjs).
#
# Acrescentado 2026-09-15: também busca as DUAS libs "Design Acessível"
# (desktop + mobile), que alimentam só os marcadores visuais do próprio
# hac e o dropdown "Componente do DSC" mobile — nunca o scan/matching
# DSC→a11y acima. Motivo: essas libs vinham sendo atualizadas manualmente,
# fora de qualquer esteira, e isso já causou uma publicação não percebida
# por 6 dias e uma regressão silenciosa de nomenclatura só descoberta
# rodando o build manualmente (ver src/plugin/refs/fetch-component-properties.cjs,
# src/plugin/refs/build-a11y-constants.cjs).
name: refresh-dsc-refs

on:
  schedule:
    - cron: "0 9 * * 1" # toda segunda, 09:00 UTC = 06:00 America/Sao_Paulo
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-dsc-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala dependencias
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Busca refs da Figma (4 libs) + regenera skeleton
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          node src/plugin/refs/fetch-design-refs.cjs
          node src/plugin/refs/fetch-instruction-frames.cjs
          node src/plugin/refs/build-skeleton.cjs

      - name: "Regenera mapeamento DSC→a11y (4 libs: web-angular-react, super-app, super-dsc-web, dsc-android)"
        run: |
          node src/plugin/refs/build-dsc-a11y-mapping.cjs
          node src/plugin/refs/build-dsc-a11y-mapping.cjs --src super-app.json --out dsc-component-a11y-mapping-mobile.json
          node src/plugin/refs/build-dsc-a11y-mapping.cjs --src super-dsc-web.json --out dsc-component-a11y-mapping-superdscweb.json
          node src/plugin/refs/build-dsc-a11y-mapping.cjs --src dsc-android.json --out dsc-component-a11y-mapping-android.json

      # Acrescentado 2026-09-09 — não altera nenhum passo acima. Gera/
      # atualiza dsc-structural-review.json: para os componentes DSC de
      # match de a11y com confiança BAIXA (recém-regenerados no passo
      # acima), resolve via REST API se a árvore real tem ícone/texto
      # visível como filho — segunda fonte de evidência pro matching, que
      # hoje é só por nome. Nunca sobrescreve entradas já revisadas
      # (manualmente ou por execução anterior deste passo) — só preenche o
      # que ainda estiver pendente. Reaproveita o MESMO FIGMA_TOKEN já
      # usado acima, sem secret novo. Nunca impeditivo: sem o token, ou em
      # caso de falha pontual num componente, o passo segue best-effort
      # (ver comentário de topo do script).
      - name: Gera/atualiza revisão estrutural de componentes de match incerto
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node src/plugin/refs/build-dsc-structural-candidates.cjs

      # Acrescentado 2026-09-15 — libs "Design Acessível" (desktop e
      # mobile), usadas só pros marcadores visuais do próprio hac
      # (Agrupamento/Conectores/Item Number/dropdown "Componente do DSC"
      # mobile), não pelo scan/matching DSC→a11y acima. Ficavam de fora
      # do CI e só eram atualizadas manualmente — motivo real: a lib
      # mobile passou 6 dias sem publicação percebida (bloqueando uma
      # migração pendente) e, quando finalmente publicada, mudou nomes de
      # variante sem aviso (regressão silenciosa em A11Y_MOBILE_WRAPPER,
      # só percebida rodando o build manualmente). --deep-scan é
      # obrigatório aqui: as properties reais (VARIANT "Componente",
      # "Conector") vivem em component sets OCULTOS, só alcançáveis via
      # tree-walk, não pelo GET /component_sets padrão. --reset ignora
      # qualquer checkpoint parcial (checkout de CI é sempre limpo; ver
      # src/plugin/refs/.checkpoints/, ignorado no git).
      - name: "Regenera refs das libs Design Acessível (desktop + mobile) e constantes derivadas"
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          node src/plugin/refs/fetch-component-properties.cjs --lib design-acessivel --deep-scan --reset
          node src/plugin/refs/fetch-component-properties.cjs --lib design-acessivel-mobile --deep-scan --reset
          node src/plugin/refs/build-a11y-constants.cjs

      # Acrescentado 2026-09-30 — compara os tokens visuais do próprio hac
      # (tailwind.config.cjs, telas, plugin.css) com a ref recém-buscada da
      # lib "DSC | Fundamentos Visuais" (fetch-design-refs.cjs já a inclui pelo
      # manifest). Só INFORMA: o resultado entra no corpo do PR para revisão
      # humana, nunca bloqueia o refresh das refs — por isso
      # continue-on-error e saída 0 (sem --strict). Se a lib mudar um token
      # (ex.: nova versão de espaçamento ou cor), o desvio aparece aqui antes
      # de virar inconsistência silenciosa na interface.
      - name: Confere alinhamento visual do hac com a lib Fundamentos Visuais
        continue-on-error: true
        run: node src/plugin/refs/check-visual-foundations.cjs | tee /tmp/visual-check.txt

      # Acrescentado 2026-10-01 — audita TODA component key (hash de 40 hex)
      # escrita no código (marcadores, selos, wrappers Box specs) via GET
      # /v1/components/{key} e confere que resolve para o arquivo próprio
      # "[HAC] Handoff Super DSC Mobile e Web" (HhriLSpKnCB2dHhyiU16iB).
      # Uma key que aponta para a lib antiga (Wy0IhXRVZMSOOr8E609UqI) ou não
      # resolve foi exatamente o defeito que passou 3 vezes despercebido.
      # Só INFORMA (continue-on-error), igual ao passo visual acima: com
      # --strict o script sai com 1 quando há desvio, o que deixa o passo
      # vermelho na execução sem bloquear o PR de refresh.
      - name: Audita keys de componente do código contra o arquivo próprio
        continue-on-error: true
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node src/plugin/refs/check-lib-sources.cjs --strict | tee /tmp/lib-sources-check.txt

      - name: Verifica se algo mudou
        id: diff
        run: |
          if git diff --quiet -- src/plugin/refs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Abre PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "hac-bot@users.noreply.github.com"
          git config user.name "hac Refs Bot"
          BRANCH="bot/dsc-refs-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add src/plugin/refs/
          git commit -m "chore(dsc): atualiza refs DSC (4 libs + Fundamentos Visuais + Design Acessível) e mapeamentos/constantes de a11y ($(date -u +%Y-%m-%d))"
          git push origin "$BRANCH"
          {
            echo 'Atualização automática das refs (`src/plugin/refs/`): as quatro libs DSC de produto (web-angular-react, super-app, super-dsc-web, dsc-android) com regeneração dos quatro mapeamentos DSC→a11y, a lib de tokens visuais `fundamentos-visuais`, e as duas libs Design Acessível (desktop + mobile) com regeneração das constantes de a11y derivadas (`_a11y-constants.generated.js`, `design-acessivel-mobile-wrapper.generated.json`) — todas buscadas via REST API do Figma. Revisar o diff e aprovar se OK.'
            echo
            echo '### Alinhamento visual do hac com a lib Fundamentos Visuais'
            echo
            if [ -s /tmp/visual-check.txt ]; then
              echo "**Resultado:** $(tail -n 1 /tmp/visual-check.txt)"
              echo
              echo '<details><summary>Relatório completo</summary>'
              echo
              echo '```'
              cat /tmp/visual-check.txt
              echo '```'
              echo '</details>'
            else
              echo 'O verificador não produziu saída neste run (ver o passo "Confere alinhamento visual" nos logs).'
            fi
          } > /tmp/pr-body.md
          gh pr create \
            --title "chore(dsc): atualização automática das refs DSC — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH"
