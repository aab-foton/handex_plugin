<!-- VIEW: SPECIFICATIONS -->
    <main id="view-specifications" class="view flex p-0 flex-col h-full overflow-hidden">
      <!-- Header -->
      <div class="subheader-brand px-4 py-3 bg-[#3d3dff] dark:bg-[#00335c] flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center gap-2 min-w-0">
          <button onclick="navigate('view-home')" aria-label="Voltar para a página inicial" class="p-2 bg-white/10 dark:bg-white/10 rounded-xl hover:bg-white/20 dark:hover:bg-white/20 transition-colors shrink-0">
            <i data-lucide="arrow-left" class="w-4 h-4 text-white" aria-hidden="true"></i>
          </button>
          <h2 class="text-white font-bold text-[18px] truncate min-w-0">Anotar Specs</h2>
          <button type="button" onclick="openOnboarding('specs')"
            class="w-4 h-4 flex items-center justify-center text-white/70 hover:text-white transition-colors shrink-0"
            title="Como funciona esta ferramenta" aria-label="Como funciona esta ferramenta">
            <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i>
          </button>
          <button type="button" onclick="openHelp()"
            class="w-4 h-4 flex items-center justify-center text-white/70 hover:text-white transition-colors shrink-0"
            title="Ver guia de categorias" aria-label="Ver guia de categorias de especificação">
            <i data-lucide="circle-help" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="specs-header-action-form" onclick="openSpecFormModal()" class="fab-inline" title="Criar especificação" aria-label="Criar especificação">
            <i data-lucide="plus" class="w-4 h-4 shrink-0"></i>
            <span>Nova spec</span>
          </button>
        </div>
      </div>

      <!-- Scrollable content -->
      <div id="specs-scroll-container" class="flex-1 overflow-y-auto pt-3 px-4 pb-4" onscroll="handleScroll(this)">
        <div class="space-y-4 w-full mx-auto">

          <!-- Título da seção + Recolher/expandir todos -- logo abaixo do
               header, acima da lista de cards. -->
          <div class="flex items-center justify-between">
            <p id="specs-section-title" class="hidden text-[11px] font-bold text-slate-500 dark:text-dark-muted uppercase tracking-wider">Specs Criadas</p>
            <div class="flex items-center gap-3">
              <button id="btn-hide-all-specs" onclick="toggleAllSpecsVisibility()"
                class="hidden text-[11px] font-bold text-slate-500 hover:text-slate-700 dark:text-slate-500 dark:hover:text-slate-200 transition-colors">
                Ocultar tudo
              </button>
              <button data-collapse-toggle onclick="collapseAllAccordions(document.getElementById('specs-scroll-container'))"
                class="hidden text-[11px] font-bold text-slate-500 hover:text-slate-700 dark:text-slate-500 dark:hover:text-slate-200 transition-colors">
                Recolher todos
              </button>
            </div>
          </div>

          <!-- Onboarding banner (primeira visita) -->
          <div id="onboarding-banner-specs" class="hidden flex items-start gap-2.5 bg-[#3d3dff]/5 dark:bg-blue-900/10 border border-[#3d3dff]/20 dark:border-blue-800/30 rounded-2xl p-3.5">
            <i data-lucide="sparkles" class="w-4 h-4 text-[#3d3dff] dark:text-blue-300 shrink-0 mt-0.5"></i>
            <div class="flex-1 min-w-0">
              <p class="text-[11px] font-bold text-[#2e2ee0] dark:text-blue-300">Primeira vez aqui?</p>
              <p class="text-[10px] text-[#2e2ee0]/80 dark:text-blue-300/80 leading-relaxed mt-0.5">Veja como criar e organizar especificações no canvas.</p>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button type="button" onclick="openOnboarding('specs', { markSeenOnOpen: true })" class="px-2.5 py-1 bg-[#3d3dff] hover:bg-[#2e2ee0] text-white text-[10px] font-bold rounded-lg transition-colors">Ver agora</button>
              <button type="button" onclick="dismissOnboardingBanner('specs')" title="Dispensar" aria-label="Dispensar" class="p-1 text-[#3d3dff]/60 hover:text-[#3d3dff] dark:text-blue-300/60 dark:hover:text-blue-300 transition-colors">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>

          <!-- Frame Selector -->
          <div data-frame-selector-card>
            <div class="flex items-center gap-2 mb-2.5">
              <i data-lucide="scan-line" class="w-3.5 h-3.5 text-slate-500 dark:text-dark-muted shrink-0"></i>
              <h4 id="spec-frame-selector-label" class="text-[11px] font-bold text-slate-500 dark:text-dark-muted uppercase tracking-wider">Frames Mapeados</h4>
            </div>
            <select id="spec-frame-selector" onchange="setMeasureActiveFrame(this.value)"
              class="w-full text-[12px] bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-dark-line rounded-xl px-3 py-2.5 text-slate-700 dark:text-white outline-none focus:border-[#3d3dff]/50 transition-colors">
              <option value="">Sem vínculo (spec avulsa)</option>
            </select>
            <p id="spec-frame-selector-hint" class="text-[10px] text-slate-500 dark:text-dark-muted mt-2 leading-tight">
              Selecione um frame para focá-lo no canvas e associar esta spec a ele.
            </p>
          </div>

          <div id="specs-form" class="space-y-4">

            <div>

              <!-- Instrução discreta -->
              <div id="hint-specs" class="mb-5 min-h-[76px] p-3 bg-blue-50 dark:bg-blue-900/20 rounded-xl border border-blue-100 dark:border-blue-800/30 flex gap-2">
                <i data-lucide="info" class="w-4 h-4 text-blue-600 dark:text-blue-400 shrink-0 mt-0.5"></i>
                <p class="text-[11px] text-blue-800 dark:text-blue-300 leading-tight">
                  Selecione um elemento no canvas e toque no botão <strong>+</strong> no topo para criar uma especificação.
                </p>
              </div>

              <ul id="specs-results" class="flex flex-col gap-2 min-h-[50px]">
                <!-- List of accordions will be rendered here -->
              </ul>
            </div>
          </div>

          <!-- Finalizar Registros — ação única de fechamento, tom discreto (outline)
               para não competir com "Nova spec" no header, a ação mais
               frequente da tela. Só aparece com specs criadas (ver renderSpecsList). -->
          <div id="btn-finalize-specs-wrap" class="hidden pt-4 pb-2">
            <button onclick="finalizeSection('specs')"
              class="w-full flex items-center justify-center gap-2 py-3 bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-line rounded-2xl text-[12px] font-bold text-slate-600 dark:text-dark-muted hover:bg-gray-50 dark:hover:bg-slate-800 hover:border-slate-300 transition-all shadow-sm">
              <i data-lucide="clipboard-check" class="w-4 h-4" aria-hidden="true"></i>
              Finalizar Registros
            </button>
          </div>

        </div>
      </div>

    </main>
