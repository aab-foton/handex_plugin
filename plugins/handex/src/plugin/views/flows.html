<!-- VIEW: FLOWS (Diagramas de Fluxo) -->
<main id="view-flows" class="view flex p-0 flex-col h-full overflow-hidden">
  <!-- Sub-Header -->
  <div class="subheader-brand px-4 py-3 bg-[#3d3dff] dark:bg-[#00335c] flex items-center justify-between shrink-0 shadow-md">
    <div class="flex items-center gap-2 min-w-0">
      <button onclick="navigate('view-home')" aria-label="Voltar para a página inicial"
        class="p-2 bg-white/10 dark:bg-white/10 rounded-xl hover:bg-white/20 dark:hover:bg-white/20 transition-colors shrink-0">
        <i data-lucide="arrow-left" class="w-4 h-4 text-white" aria-hidden="true"></i>
      </button>
      <h2 class="text-white font-bold text-[18px] truncate min-w-0">Fluxos de Tela</h2>
      <button type="button" onclick="openOnboarding('fluxos')"
        class="w-4 h-4 flex items-center justify-center text-white/70 hover:text-white transition-colors shrink-0"
        title="Como funciona esta ferramenta" aria-label="Como funciona esta ferramenta">
        <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i>
      </button>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button id="btn-resync-flows" onclick="resyncAllFlows()" class="hidden p-2 bg-white/10 dark:bg-white/10 rounded-xl hover:bg-white/20 dark:hover:bg-white/20 transition-colors" title="Redesenhar todas as linhas no canvas a partir dos dados salvos — use se moveu os frames e as conexões ficaram desalinhadas" aria-label="Redesenhar todas as linhas de fluxo no canvas">
        <i data-lucide="refresh-cw" class="w-4 h-4 text-white" aria-hidden="true"></i>
      </button>
      <button onclick="openFlowFormModal()" class="fab-inline shrink-0" title="Conectar Frames" aria-label="Conectar Frames">
        <i data-lucide="git-branch" class="w-4 h-4 shrink-0"></i>
        <span>Conectar Frames</span>
      </button>
    </div>
  </div>

  <!-- Scrollable Content -->
  <div id="flows-scroll-container" class="flex-1 overflow-y-auto pt-3 px-4 pb-4 space-y-4" onscroll="handleScroll(this)">

    <!-- Título da seção + Recolher/expandir todos -- logo abaixo do
         header, acima da lista de jornadas. -->
    <div class="flex items-center justify-between">
      <p id="flows-section-title" class="hidden text-[11px] font-bold text-slate-500 dark:text-dark-muted uppercase tracking-wider">Fluxos Desenhados</p>
      <button data-collapse-toggle onclick="collapseAllAccordions(document.getElementById('flows-scroll-container'))"
        class="hidden text-[11px] font-bold text-slate-500 hover:text-slate-700 dark:text-slate-500 dark:hover:text-slate-200 transition-colors">
        Recolher todos
      </button>
    </div>

    <!-- Onboarding banner (primeira visita) -->
    <div id="onboarding-banner-fluxos" class="hidden flex items-start gap-2.5 bg-[#3d3dff]/5 dark:bg-blue-900/10 border border-[#3d3dff]/20 dark:border-blue-800/30 rounded-2xl p-3.5">
      <i data-lucide="sparkles" class="w-4 h-4 text-[#3d3dff] dark:text-blue-300 shrink-0 mt-0.5"></i>
      <div class="flex-1 min-w-0">
        <p class="text-[11px] font-bold text-[#2e2ee0] dark:text-blue-300">Primeira vez aqui?</p>
        <p class="text-[10px] text-[#2e2ee0]/80 dark:text-blue-300/80 leading-relaxed mt-0.5">Veja como conectar frames e mapear fluxos.</p>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button type="button" onclick="openOnboarding('fluxos', { markSeenOnOpen: true })" class="px-2.5 py-1 bg-[#3d3dff] hover:bg-[#2e2ee0] text-white text-[10px] font-bold rounded-lg transition-colors">Ver agora</button>
        <button type="button" onclick="dismissOnboardingBanner('fluxos')" title="Dispensar" aria-label="Dispensar" class="p-1 text-[#3d3dff]/60 hover:text-[#3d3dff] dark:text-blue-300/60 dark:hover:text-blue-300 transition-colors">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <div id="hint-flows" class="min-h-[76px] p-3 bg-blue-50 dark:bg-blue-900/20 rounded-xl border border-blue-100 dark:border-blue-800/30 flex items-center gap-2.5">
      <i data-lucide="info" class="w-4 h-4 text-blue-600 dark:text-blue-400 shrink-0"></i>
      <p class="text-[11px] text-blue-800 dark:text-blue-300 leading-tight">
        Selecione dois ou mais elementos no Figma e use o botão <strong>+ Conectar Frames</strong> para mapear fluxos de navegação. Com 3 ou mais, o plugin conecta em sequência automaticamente (da esquerda para a direita).
      </p>
    </div>

    <ul id="flows-results" class="flex flex-col gap-2 min-h-[50px]">
      <!-- renderFlowsList() insere aqui -->
    </ul>

    <!-- Finalizar Registros — ação única de fechamento, tom discreto (outline)
         para não competir com "Conectar Frames" no header, a ação mais
         frequente da tela. Só aparece com fluxos criados (ver renderFlowsList). -->
    <div id="btn-finalize-flows-wrap" class="hidden pt-4 pb-2">
      <button onclick="finalizeSection('flows')"
        class="w-full flex items-center justify-center gap-2 py-3 bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-line rounded-2xl text-[12px] font-bold text-slate-600 dark:text-dark-muted hover:bg-gray-50 dark:hover:bg-slate-800 hover:border-slate-300 transition-all shadow-sm">
        <i data-lucide="clipboard-check" class="w-4 h-4" aria-hidden="true"></i>
        Finalizar Registros
      </button>
    </div>

  </div>

</main>
