<!-- VIEW: FLOWS (Diagramas de Fluxo) -->
<main id="view-flows" class="view flex p-0 flex-col h-full overflow-hidden">
  <!-- Sub-Header -->
  <div class="subheader-brand px-4 py-3 bg-[#005ca9] dark:bg-[#00335c] flex items-center justify-between shrink-0 shadow-md">
    <div class="flex items-center gap-2 min-w-0">
      <button onclick="navigate('view-home')" aria-label="Voltar para a página inicial"
        class="min-w-[40px] min-h-[40px] flex items-center justify-center bg-white/10 dark:bg-white/10 rounded-xl hover:bg-white/20 dark:hover:bg-white/20 transition-colors shrink-0">
        <i data-lucide="arrow-left" class="w-5 h-5 text-white" aria-hidden="true"></i>
      </button>
      <h2 class="text-white font-bold text-[18px] truncate min-w-0">Fluxos de Tela</h2>
    </div>
    <!-- Ícones de ajuda: vivem no grupo esquerdo (ao lado do título) quando
         o botão de ação está no header; movidos pro grupo direito (ver
         _moveHeaderHelpIcons em core.js) quando o botão vira CTA centralizado
         no empty-state -- evita o header ficar com um lado vazio (aqui o
         lado direito ficaria totalmente vazio, já que #btn-resync-flows
         também está hidden até haver fluxos). -->
    <div id="flows-header-help-icons" class="flex items-center gap-2 min-w-0">
      <button type="button" onclick="openOnboarding('fluxos')"
        class="min-w-[40px] min-h-[40px] flex items-center justify-center text-white/70 hover:text-white transition-colors shrink-0"
        title="Como funciona esta ferramenta" aria-label="Como funciona esta ferramenta">
        <i data-lucide="graduation-cap" class="w-4.5 h-4.5"></i>
      </button>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button id="btn-resync-flows" onclick="resyncAllFlows()" class="hidden min-w-[40px] min-h-[40px] flex items-center justify-center bg-white/10 dark:bg-white/10 rounded-xl hover:bg-white/20 dark:hover:bg-white/20 transition-colors" title="Redesenhar todas as linhas no canvas a partir dos dados salvos — use se moveu os frames e as conexões ficaram desalinhadas" aria-label="Redesenhar todas as linhas de fluxo no canvas">
        <i data-lucide="refresh-cw" class="w-5 h-5 text-white" aria-hidden="true"></i>
      </button>
      <!-- Some do header enquanto não há nenhum fluxo -- vira CTA
           centralizado no empty-state (renderFlowsList em specifications.js),
           "sobe" pro header assim que o primeiro fluxo é criado. Botão de
           resync acima segue sua própria regra (só aparece com fluxos
           existentes), não faz parte desta troca. -->
      <button id="btn-flow-connect-header" onclick="openFlowFormModal()" class="fab-inline shrink-0 hidden" title="Conectar Frames" aria-label="Conectar Frames">
        <i data-lucide="git-branch" class="w-4 h-4 shrink-0"></i>
        <span>Conectar Frames</span>
      </button>
    </div>
  </div>

  <!-- Scrollable Content -->
  <div id="flows-scroll-container" class="flex-1 overflow-y-auto pt-3 px-4 pb-4 space-y-4" onscroll="handleScroll(this)">

    <!-- Título da seção + Recolher/expandir todos -- logo abaixo do
         header, acima da lista de jornadas. -->
    <div class="flex items-center justify-between">
      <p id="flows-section-title" class="hidden text-[11px] font-bold text-slate-600 dark:text-dark-muted uppercase tracking-wider">Fluxos Desenhados</p>
      <button data-collapse-toggle onclick="collapseAllAccordions(document.getElementById('flows-scroll-container'))"
        class="hidden text-[11px] font-bold text-slate-500 hover:text-slate-700 dark:text-slate-500 dark:hover:text-slate-200 transition-colors">
        Recolher todos
      </button>
    </div>

    <!-- Onboarding banner (primeira visita) -->
    <div id="onboarding-banner-fluxos" class="hidden flex items-start gap-2.5 bg-[#005ca9]/5 dark:bg-blue-900/10 border border-[#005ca9]/20 dark:border-blue-800/30 rounded-2xl p-3.5">
      <i data-lucide="sparkles" class="w-4 h-4 text-[#005ca9] dark:text-blue-300 shrink-0 mt-0.5"></i>
      <div class="flex-1 min-w-0">
        <p class="text-[11px] font-bold text-[#004d8d] dark:text-blue-300">Primeira vez aqui?</p>
        <p class="text-[10px] text-[#004d8d]/80 dark:text-blue-300/80 leading-relaxed mt-0.5">Veja como conectar frames e mapear fluxos.</p>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button type="button" onclick="openOnboarding('fluxos', { markSeenOnOpen: true })" class="px-2.5 py-1 bg-[#005ca9] hover:bg-[#004d8d] text-white text-[10px] font-bold rounded-lg transition-colors">Ver agora</button>
        <button type="button" onclick="dismissOnboardingBanner('fluxos')" title="Dispensar" aria-label="Dispensar" class="min-w-[40px] min-h-[40px] flex items-center justify-center -mr-[13px] text-[#005ca9]/80 hover:text-[#005ca9] dark:text-blue-300/60 dark:hover:text-blue-300 transition-colors">
          <i data-lucide="x" class="w-4.5 h-4.5"></i>
        </button>
      </div>
    </div>

    <ul id="flows-results" class="flex flex-col gap-2 min-h-[50px]">
      <!-- renderFlowsList() insere aqui -->
    </ul>

    <!-- Inserir/Atualizar na Ficha — botão único, sincroniza esta seção no
         canvas imediatamente. Texto e ícone trocam pra "Atualizar" assim que
         a seção já foi inserida uma vez (ver _updateInsertFichaButtonLabel em
         handoff.js). Só aparece com fluxos criados (ver renderFlowsList). -->
    <div id="btn-finalize-flows-wrap" class="hidden pt-4 pb-2">
      <button id="btn-insert-ficha-flows" onclick="insertSectionInFicha('flows')"
        class="w-full flex items-center justify-center gap-2 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl text-[12px] font-bold transition-all shadow-sm">
        <i data-lucide="file-plus-2" class="w-4 h-4" aria-hidden="true"></i>
        Inserir Fluxos na Ficha
      </button>
    </div>

  </div>

</main>
