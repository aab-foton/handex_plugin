<!-- VIEW: HANDOFF SUMMARY -->
<main id="view-handoff-summary" class="view flex p-0 flex-col h-full overflow-hidden">
  <!-- Header -->
  <div class="subheader-brand px-4 py-3 bg-[#3d3dff] dark:bg-[#00335c] flex items-center justify-between shrink-0 shadow-md">
    <div class="flex items-center gap-2">
      <button onclick="navigate('view-home')" aria-label="Voltar"
        class="p-2 bg-white/10 dark:bg-white/10 rounded-xl hover:bg-white/20 dark:hover:bg-white/20 transition-colors shrink-0">
        <i data-lucide="arrow-left" class="w-4 h-4 text-white" aria-hidden="true"></i>
      </button>
      <div>
        <h2 class="text-white font-bold text-[16px]">Handoff</h2>
        <p class="text-[10px] text-blue-100 leading-none mt-0.5">Resumo e exportação da entrega</p>
      </div>
    </div>
    <button type="button" onclick="openOnboarding('handoffSummary')" title="Como funciona esta etapa" aria-label="Como funciona esta etapa"
      class="w-7 h-7 flex items-center justify-center text-white/70 hover:text-white transition-colors shrink-0">
      <i data-lucide="circle-help" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Scrollable content -->
  <div class="flex-1 overflow-y-auto pt-3 px-4 space-y-4 pb-6" onscroll="handleScroll(this)">

    <!-- Onboarding banner (primeira visita) -->
    <div id="onboarding-banner-handoffSummary" class="hidden flex items-start gap-2.5 bg-[#3d3dff]/5 dark:bg-blue-900/10 border border-[#3d3dff]/20 dark:border-blue-800/30 rounded-2xl p-3.5">
      <i data-lucide="sparkles" class="w-4 h-4 text-[#3d3dff] dark:text-blue-300 shrink-0 mt-0.5"></i>
      <div class="flex-1 min-w-0">
        <p class="text-[11px] font-bold text-[#2e2ee0] dark:text-blue-300">Primeira vez aqui?</p>
        <p class="text-[10px] text-[#2e2ee0]/80 dark:text-blue-300/80 leading-relaxed mt-0.5">Veja como gerar e exportar a Ficha de Handoff.</p>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button type="button" onclick="openOnboarding('handoffSummary', { markSeenOnOpen: true })" class="px-2.5 py-1 bg-[#3d3dff] hover:bg-[#2e2ee0] text-white text-[10px] font-bold rounded-lg transition-colors">Ver agora</button>
        <button type="button" onclick="dismissOnboardingBanner('handoffSummary')" title="Dispensar" aria-label="Dispensar" class="p-1 text-[#3d3dff]/60 hover:text-[#3d3dff] dark:text-blue-300/60 dark:hover:text-blue-300 transition-colors">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- Resumo do Projeto -->
    <div class="bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line rounded-2xl shadow-sm p-4">
      <h4 class="text-[11px] font-bold text-slate-500 dark:text-dark-muted uppercase tracking-wider mb-3">Resumo do Projeto</h4>
      <div id="handoff-summary-project" class="space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-[12px] text-slate-500 dark:text-dark-muted">Projeto</span>
          <span id="hs-titulo" class="text-[12px] font-bold text-slate-800 dark:text-white text-right max-w-[200px] truncate">—</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-[12px] text-slate-500 dark:text-dark-muted">Versão</span>
          <span id="hs-versao" class="text-[12px] font-bold text-slate-800 dark:text-white">—</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-[12px] text-slate-500 dark:text-dark-muted">Status</span>
          <span id="hs-status" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold bg-gray-100 dark:bg-slate-700 text-slate-600 dark:text-dark-muted">
            <span id="hs-status-dot" class="w-1.5 h-1.5 rounded-full shrink-0 bg-gray-400"></span>
            <span id="hs-status-text">—</span>
          </span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-[12px] text-slate-500 dark:text-dark-muted">Designer</span>
          <span id="hs-designer" class="text-[12px] font-bold text-slate-800 dark:text-white text-right max-w-[200px] truncate">—</span>
        </div>
        <div id="hs-jornada-row" class="hidden flex items-center justify-between">
          <span class="text-[12px] text-slate-500 dark:text-dark-muted">Jornada</span>
          <span id="hs-jornada" class="text-[12px] font-bold text-slate-800 dark:text-white text-right max-w-[200px] truncate">—</span>
        </div>
        <div id="hs-feature-row" class="hidden flex items-center justify-between">
          <span class="text-[12px] text-slate-500 dark:text-dark-muted">Feature</span>
          <span id="hs-feature" class="text-[12px] font-bold text-slate-800 dark:text-white text-right max-w-[200px] truncate">—</span>
        </div>
      </div>
    </div>

    <!-- Estatísticas -->
    <div class="bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line rounded-2xl shadow-sm p-4">
      <h4 class="text-[11px] font-bold text-slate-500 dark:text-dark-muted uppercase tracking-wider mb-3">Documentação</h4>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-sky-50 dark:bg-sky-900/20 rounded-xl p-3 text-center">
          <p id="hs-count-frames" class="text-[22px] font-extrabold text-sky-600 dark:text-sky-400 leading-none">0</p>
          <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-1">Frames</p>
        </div>
        <div class="bg-indigo-50 dark:bg-indigo-900/20 rounded-xl p-3 text-center">
          <p id="hs-count-specs" class="text-[22px] font-extrabold text-indigo-600 dark:text-indigo-400 leading-none">0</p>
          <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-1">Specs</p>
        </div>
        <div class="bg-cyan-50 dark:bg-cyan-900/20 rounded-xl p-3 text-center">
          <p id="hs-count-measures" class="text-[22px] font-extrabold text-cyan-600 dark:text-cyan-400 leading-none">0</p>
          <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-1">Medidas</p>
        </div>
        <div class="bg-purple-50 dark:bg-purple-900/20 rounded-xl p-3 text-center">
          <p id="hs-count-flows" class="text-[22px] font-extrabold text-purple-600 dark:text-purple-400 leading-none">0</p>
          <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-1">Fluxos</p>
        </div>
      </div>
    </div>

    <!-- Ações de Exportação -->
    <div class="bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line rounded-2xl shadow-sm p-4">
      <h4 class="text-[11px] font-bold text-slate-500 dark:text-dark-muted uppercase tracking-wider mb-3">Exportar</h4>
      <div class="space-y-2.5">

        <!-- Exportar .MD -->
        <button onclick="exportHandoffMD()"
          class="w-full flex items-center gap-3 px-4 py-3 bg-gray-50 dark:bg-dark-bg hover:bg-gray-100 dark:hover:bg-slate-800 border border-gray-200 dark:border-dark-line rounded-2xl transition-colors text-left">
          <div class="w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700 rounded-lg shrink-0">
            <i data-lucide="file-text" class="w-4 h-4 text-slate-600 dark:text-slate-300"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[12px] font-bold text-slate-800 dark:text-white">Exportar como Markdown</p>
            <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-0.5">Documentação técnica em formato .MD</p>
          </div>
          <i data-lucide="download" class="w-4 h-4 text-slate-500 dark:text-dark-muted shrink-0"></i>
        </button>

        <!-- Exportar .JSON -->
        <button onclick="exportHandoffData()"
          class="w-full flex items-center gap-3 px-4 py-3 bg-gray-50 dark:bg-dark-bg hover:bg-gray-100 dark:hover:bg-slate-800 border border-gray-200 dark:border-dark-line rounded-2xl transition-colors text-left">
          <div class="w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700 rounded-lg shrink-0">
            <i data-lucide="braces" class="w-4 h-4 text-slate-600 dark:text-slate-300"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[12px] font-bold text-slate-800 dark:text-white">Exportar como JSON</p>
            <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-0.5">Backup completo dos dados do projeto</p>
          </div>
          <i data-lucide="download" class="w-4 h-4 text-slate-500 dark:text-dark-muted shrink-0"></i>
        </button>

        <!-- Exportar Briefing .MD -->
        <button onclick="exportBriefingMD()"
          class="w-full flex items-center gap-3 px-4 py-3 bg-gray-50 dark:bg-dark-bg hover:bg-gray-100 dark:hover:bg-slate-800 border border-gray-200 dark:border-dark-line rounded-2xl transition-colors text-left">
          <div class="w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700 rounded-lg shrink-0">
            <i data-lucide="message-square-plus" class="w-4 h-4 text-slate-600 dark:text-slate-300"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[12px] font-bold text-slate-800 dark:text-white">Exportar Briefing</p>
            <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-0.5">Perguntas e respostas em .MD, por eixo</p>
          </div>
          <i data-lucide="download" class="w-4 h-4 text-slate-500 dark:text-dark-muted shrink-0"></i>
        </button>

        <!-- Publicar no Sharepoint (oculto — integração em discussão técnica) -->

      </div>
    </div>

    <!-- Gerar Ficha no Canvas -->
    <button onclick="openHandoffInjectModal()"
      title="Gerar Ficha no Canvas" aria-label="Gerar Ficha no Canvas"
      class="w-full flex items-center justify-center gap-2 py-3.5 bg-[#3d3dff] hover:bg-[#2e2ee0] rounded-2xl text-[13px] font-bold text-white transition-all shadow-md">
      <i data-lucide="sparkles" class="w-4 h-4" aria-hidden="true"></i>
      Gerar Ficha
    </button>

  </div>
</main>
