# =============================================================================
# CAIXA Design — Monorepo CI
#
# Este é o único arquivo CI no root do monorepo. Cada plugin pode anexar
# seus próprios jobs aqui (ou via `include:`). Hoje só temos o job do handex.
#
# Os bots de atualização automática (refresh-dsc-skeleton, check-npm-deps)
# migraram para GitHub Actions em 22/07/2026 (.github/workflows/) -- o runner
# de projeto do GitLab ("notebook-augusto-temp") é uma máquina pessoal e
# ficava Stale, travando jobs agendados sem executor disponível. Além disso,
# este é o repositório compartilhado do design-foton (múltiplos projetos) --
# preferimos não ter bots abrindo MR aqui sem supervisão de quem administra
# o repo inteiro. GitHub (handex_plugin) é exclusivo do Handex.
#
# Único job que continua aqui: handex-lint, porque roda em todo push/MR
# (gate de qualidade local ao repo principal), não é um bot agendado.
# =============================================================================

stages:
  - lint

variables:
  GIT_DEPTH: "5"
  HANDEX_DIR: "plugins/handex"

# ─── Job: handex-lint ───────────────────────────────────────────────────────
# Unico job que roda em TODO push/merge request. tsc --noEmit +
# check-figma-api-usage.cjs -- este ultimo existe porque restricoes de
# runtime do Figma sob documentAccess: dynamic-page (ex: figma.getVariableById
# sincrono) nao aparecem no tsc, so quebram dentro do Figma. Ja causou um
# incidente de producao real (21/07/2026, ver docs/architecture-state.md
# secao 8) -- este gate existe para pegar regressoes desse tipo antes do
# merge, nao so quando alguem testa manualmente.
handex-lint:
  stage: lint
  image: node:20-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "plugins/handex/src/**/*"
        - "plugins/handex/package.json"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "plugins/handex/src/**/*"
        - "plugins/handex/package.json"
  script:
    - cd "${HANDEX_DIR}"
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run lint
