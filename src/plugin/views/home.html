<!-- VIEW: HOME -->
<main id="view-home" class="view active px-4 py-3 flex flex-col h-full overflow-y-auto">

  <!-- Título -->
  <div class="mb-2.5 flex items-start justify-between gap-2">
    <div class="min-w-0">
      <h2 class="text-[#1E293B] dark:text-white font-extrabold text-[14px] tracking-tight">Do design à entrega, sem perder detalhes.</h2>
      <p class="text-slate-500 dark:text-dark-muted text-[11px] mt-0.5">Escaneie tokens, registre specs, mapeie fluxos e gere sua ficha técnica.</p>
    </div>
    <button type="button" onclick="openOnboarding('home')" title="Como funciona esta tela" aria-label="Como funciona esta tela"
      class="w-7 h-7 flex items-center justify-center text-slate-400 dark:text-dark-muted hover:text-slate-600 dark:hover:text-white transition-colors shrink-0">
      <i data-lucide="circle-help" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Onboarding banner (primeira visita) -->
  <div id="onboarding-banner-home" class="hidden flex items-start gap-2.5 bg-[#3d3dff]/5 dark:bg-blue-900/10 border border-[#3d3dff]/20 dark:border-blue-800/30 rounded-2xl p-3.5 mb-2.5">
    <i data-lucide="sparkles" class="w-4 h-4 text-[#3d3dff] dark:text-blue-300 shrink-0 mt-0.5"></i>
    <div class="flex-1 min-w-0">
      <p class="text-[11px] font-bold text-[#2e2ee0] dark:text-blue-300">Primeira vez aqui?</p>
      <p class="text-[10px] text-[#2e2ee0]/80 dark:text-blue-300/80 leading-relaxed mt-0.5">Veja como usar os cards — incluindo como reorganizá-los do seu jeito.</p>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button type="button" onclick="openOnboarding('home', { markSeenOnOpen: true })" class="px-2.5 py-1 bg-[#3d3dff] hover:bg-[#2e2ee0] text-white text-[10px] font-bold rounded-lg transition-colors">Ver agora</button>
      <button type="button" onclick="dismissOnboardingBanner('home')" title="Dispensar" aria-label="Dispensar" class="p-1 text-[#3d3dff]/60 hover:text-[#3d3dff] dark:text-blue-300/60 dark:hover:text-blue-300 transition-colors">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </div>

  <!-- Cards 2×3 — flex-1 preenche o espaço disponível; grid-rows-3 divide em 3 linhas iguais.
       Ordem reorganizável por arrastar-e-soltar (ver home-cards.js): cada card tem
       data-home-card-id estável (chave salva em localStorage, independente do DOM), e
       #home-cards-grid é o container onde a ordem visual é reaplicada no boot. -->
  <div id="home-cards-grid" class="grid grid-cols-2 grid-rows-3 gap-2 w-full flex-1">

    <!-- Guia -->
    <div data-home-card-id="guide" draggable="true"
      class="home-card-draggable relative group/card"
      ondragstart="_onHomeCardDragStart(event)" ondragover="_onHomeCardDragOver(event)"
      ondrop="_onHomeCardDrop(event)" ondragend="_onHomeCardDragEnd(event)">
      <button onclick="navigate('view-guide')" aria-label="Guia de uso do plugin"
        class="flex flex-col items-start justify-center gap-1.5 p-3 w-full h-full bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 dark:hover:border-slate-500 rounded-2xl shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all focus:ring-2 focus:ring-slate-300/30 outline-none group text-left">
        <div class="w-10 h-10 flex items-center justify-center bg-gray-50 dark:bg-slate-700 rounded-xl shrink-0">
          <i data-lucide="book-open" class="w-5 h-5 text-slate-500 dark:text-slate-300" aria-hidden="true"></i>
        </div>
        <div class="min-w-0">
          <p class="font-extrabold text-[11px] tracking-tight text-slate-800 dark:text-white leading-tight">Como usar o plugin</p>
          <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-0.5 leading-tight">Passo a passo de cada ferramenta</p>
        </div>
      </button>
      <div class="home-card-grip absolute top-1.5 right-1.5 p-1 rounded-md text-slate-300 dark:text-slate-600 opacity-0 group-hover/card:opacity-100 cursor-grab active:cursor-grabbing transition-opacity" title="Arrastar para reorganizar" aria-hidden="true">
        <i data-lucide="grip-vertical" class="w-3.5 h-3.5 pointer-events-none"></i>
      </div>
    </div>

    <!-- Dados do Projeto -->
    <div data-home-card-id="dados-projeto" draggable="true"
      class="home-card-draggable relative group/card"
      ondragstart="_onHomeCardDragStart(event)" ondragover="_onHomeCardDragOver(event)"
      ondrop="_onHomeCardDrop(event)" ondragend="_onHomeCardDragEnd(event)">
      <button onclick="openDadosProjetoModal()" aria-label="Dados do Projeto"
        class="flex flex-col items-start justify-center gap-1.5 p-3 w-full h-full bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-[#3d3dff] hover:bg-[#3d3dff]/15 dark:hover:bg-blue-900/40 dark:hover:border-blue-500 rounded-2xl shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all focus:ring-2 focus:ring-[#3d3dff]/30 outline-none group text-left">
        <div class="w-10 h-10 flex items-center justify-center bg-blue-50 dark:bg-blue-900/20 rounded-xl shrink-0">
          <i data-lucide="clipboard-list" class="w-5 h-5 text-[#3d3dff] dark:text-blue-400" aria-hidden="true"></i>
        </div>
        <div class="min-w-0">
          <p class="font-extrabold text-[11px] tracking-tight text-slate-800 dark:text-white leading-tight">Informações do Projeto</p>
          <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-0.5 leading-tight">Título, versão, equipe e contexto</p>
        </div>
      </button>
      <div class="home-card-grip absolute top-1.5 right-1.5 p-1 rounded-md text-slate-300 dark:text-slate-600 opacity-0 group-hover/card:opacity-100 cursor-grab active:cursor-grabbing transition-opacity" title="Arrastar para reorganizar" aria-hidden="true">
        <i data-lucide="grip-vertical" class="w-3.5 h-3.5 pointer-events-none"></i>
      </div>
    </div>

    <!-- Design Tokens -->
    <div data-home-card-id="tokens" draggable="true"
      class="home-card-draggable relative group/card"
      ondragstart="_onHomeCardDragStart(event)" ondragover="_onHomeCardDragOver(event)"
      ondrop="_onHomeCardDrop(event)" ondragend="_onHomeCardDragEnd(event)">
      <button onclick="navigate('view-frames')" aria-label="Design Tokens"
        class="flex flex-col items-start justify-center gap-1.5 p-3 w-full h-full bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-sky-400 hover:bg-sky-100 dark:hover:bg-sky-900/40 dark:hover:border-sky-500 rounded-2xl shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all focus:ring-2 focus:ring-sky-300/30 outline-none group text-left">
        <div class="w-10 h-10 flex items-center justify-center bg-sky-50 dark:bg-sky-900/20 rounded-xl shrink-0">
          <i data-lucide="scan-line" class="w-5 h-5 text-sky-600 dark:text-sky-400" aria-hidden="true"></i>
        </div>
        <div class="min-w-0">
          <p class="font-extrabold text-[11px] tracking-tight text-slate-800 dark:text-white leading-tight">Escanear Tokens</p>
          <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-0.5 leading-tight">Lê tokens e valida o Design System</p>
        </div>
      </button>
      <div class="home-card-grip absolute top-1.5 right-1.5 p-1 rounded-md text-slate-300 dark:text-slate-600 opacity-0 group-hover/card:opacity-100 cursor-grab active:cursor-grabbing transition-opacity" title="Arrastar para reorganizar" aria-hidden="true">
        <i data-lucide="grip-vertical" class="w-3.5 h-3.5 pointer-events-none"></i>
      </div>
    </div>

    <!-- Especificações -->
    <div data-home-card-id="specs" draggable="true"
      class="home-card-draggable relative group/card"
      ondragstart="_onHomeCardDragStart(event)" ondragover="_onHomeCardDragOver(event)"
      ondrop="_onHomeCardDrop(event)" ondragend="_onHomeCardDragEnd(event)">
      <button onclick="navigate('view-specifications')" aria-label="Especificações"
        class="flex flex-col items-start justify-center gap-1.5 p-3 w-full h-full bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-indigo-400 dark:hover:border-indigo-500 hover:bg-indigo-100 dark:hover:bg-indigo-900/40 rounded-2xl shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all focus:ring-2 focus:ring-indigo-300/30 outline-none group text-left">
        <div class="w-10 h-10 flex items-center justify-center bg-indigo-50 dark:bg-indigo-900/20 rounded-xl shrink-0">
          <i data-lucide="tag" class="w-5 h-5 text-indigo-600 dark:text-indigo-400" aria-hidden="true"></i>
        </div>
        <div class="min-w-0">
          <p class="font-extrabold text-[11px] tracking-tight text-slate-800 dark:text-white leading-tight">Anotar Specs</p>
          <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-0.5 leading-tight">Notas técnicas e referências de componente</p>
        </div>
      </button>
      <div class="home-card-grip absolute top-1.5 right-1.5 p-1 rounded-md text-slate-300 dark:text-slate-600 opacity-0 group-hover/card:opacity-100 cursor-grab active:cursor-grabbing transition-opacity" title="Arrastar para reorganizar" aria-hidden="true">
        <i data-lucide="grip-vertical" class="w-3.5 h-3.5 pointer-events-none"></i>
      </div>
    </div>

    <!-- Medidas -->
    <div data-home-card-id="measurement" draggable="true"
      class="home-card-draggable relative group/card"
      ondragstart="_onHomeCardDragStart(event)" ondragover="_onHomeCardDragOver(event)"
      ondrop="_onHomeCardDrop(event)" ondragend="_onHomeCardDragEnd(event)">
      <button onclick="navigate('view-measurement')" aria-label="Medidas"
        class="flex flex-col items-start justify-center gap-1.5 p-3 w-full h-full bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-cyan-400 dark:hover:border-cyan-500 hover:bg-cyan-100 dark:hover:bg-cyan-900/40 rounded-2xl shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all focus:ring-2 focus:ring-cyan-300/30 outline-none group text-left">
        <div class="w-10 h-10 flex items-center justify-center bg-cyan-50 dark:bg-cyan-900/20 rounded-xl shrink-0">
          <i data-lucide="ruler" class="w-5 h-5 text-cyan-600 dark:text-cyan-400" aria-hidden="true"></i>
        </div>
        <div class="min-w-0">
          <p class="font-extrabold text-[11px] tracking-tight text-slate-800 dark:text-white leading-tight">Anotar Medidas</p>
          <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-0.5 leading-tight">Insere dimensões e espaçamentos no canvas</p>
        </div>
      </button>
      <div class="home-card-grip absolute top-1.5 right-1.5 p-1 rounded-md text-slate-300 dark:text-slate-600 opacity-0 group-hover/card:opacity-100 cursor-grab active:cursor-grabbing transition-opacity" title="Arrastar para reorganizar" aria-hidden="true">
        <i data-lucide="grip-vertical" class="w-3.5 h-3.5 pointer-events-none"></i>
      </div>
    </div>

    <!-- Fluxos -->
    <div data-home-card-id="flows" draggable="true"
      class="home-card-draggable relative group/card"
      ondragstart="_onHomeCardDragStart(event)" ondragover="_onHomeCardDragOver(event)"
      ondrop="_onHomeCardDrop(event)" ondragend="_onHomeCardDragEnd(event)">
      <button onclick="navigate('view-flows')" aria-label="Fluxos"
        class="flex flex-col items-start justify-center gap-1.5 p-3 w-full h-full bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line hover:border-purple-400 dark:hover:border-purple-500 hover:bg-purple-100 dark:hover:bg-purple-900/40 rounded-2xl shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all focus:ring-2 focus:ring-purple-300/30 outline-none group text-left">
        <div class="w-10 h-10 flex items-center justify-center bg-purple-50 dark:bg-purple-900/20 rounded-xl shrink-0">
          <i data-lucide="git-branch" class="w-5 h-5 text-purple-600 dark:text-purple-400" aria-hidden="true"></i>
        </div>
        <div class="min-w-0">
          <p class="font-extrabold text-[11px] tracking-tight text-slate-800 dark:text-white leading-tight">Fluxos de Tela</p>
          <p class="text-[10px] text-slate-500 dark:text-dark-muted mt-0.5 leading-tight">Mapeia conexões entre telas e estados</p>
        </div>
      </button>
      <div class="home-card-grip absolute top-1.5 right-1.5 p-1 rounded-md text-slate-300 dark:text-slate-600 opacity-0 group-hover/card:opacity-100 cursor-grab active:cursor-grabbing transition-opacity" title="Arrastar para reorganizar" aria-hidden="true">
        <i data-lucide="grip-vertical" class="w-3.5 h-3.5 pointer-events-none"></i>
      </div>
    </div>

  </div>

  <!-- CTA Handoff -->
  <div class="mt-auto pt-3 w-full space-y-2">
    <div class="flex gap-2">
      <button onclick="navigate('view-handoff-summary')" aria-label="Ir para Handoff"
        class="flex-1 py-2.5 bg-[#2e2ee0] hover:bg-[#004d8f] text-white text-[12px] font-extrabold rounded-2xl transition-colors flex items-center justify-center gap-2 shadow-sm">
        <i data-lucide="sparkles" class="w-4 h-4" aria-hidden="true"></i>
        Gerar Ficha de Handoff
      </button>
      <button onclick="exportHandoffData()" aria-label="Baixar backup completo em JSON"
        title="Baixar backup completo em JSON — mesmo conteúdo salvo, para restaurar ou compartilhar o projeto depois"
        class="px-3 py-2.5 bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-line rounded-2xl text-slate-500 dark:text-dark-muted hover:bg-gray-50 dark:hover:bg-slate-800 outline-none transition-all shadow-sm">
        <i data-lucide="download" class="w-4 h-4" aria-hidden="true"></i>
      </button>
    </div>

    <div class="flex gap-2">
      <button onclick="importHandoffData()" aria-label="Importar dados de um arquivo JSON"
        class="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-line rounded-2xl text-[11px] font-bold text-slate-500 dark:text-dark-muted hover:bg-gray-50 dark:hover:bg-slate-800 outline-none transition-all shadow-sm">
        <i data-lucide="upload" class="w-3.5 h-3.5" aria-hidden="true"></i> Importar JSON
      </button>
      <button onclick="clearAllData()" aria-label="Limpar todos os dados do projeto"
        title="Limpar todos os dados"
        class="px-3 py-2.5 bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-line rounded-2xl text-slate-500 dark:text-dark-muted hover:bg-red-50 dark:hover:bg-red-900/20 hover:border-red-200 dark:hover:border-red-800/40 hover:text-red-500 outline-none transition-all shadow-sm">
        <i data-lucide="trash-2" class="w-3.5 h-3.5" aria-hidden="true"></i>
      </button>
    </div>
  </div>

</main>
