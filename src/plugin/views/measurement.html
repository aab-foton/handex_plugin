<!-- VIEW: MEASUREMENT -->
    <main id="view-measurement" class="view p-0 flex flex-col h-full overflow-hidden">
      <!-- Header -->
      <div class="subheader-brand px-4 py-3 bg-[#005ca9] dark:bg-[#00335c] flex items-center justify-between gap-3 shrink-0 shadow-md">
        <div class="flex items-center gap-2 min-w-0">
          <button onclick="navigate('view-home')" aria-label="Voltar para a página inicial"
            class="min-w-[40px] min-h-[40px] flex items-center justify-center bg-white/10 dark:bg-white/10 rounded-xl hover:bg-white/20 dark:hover:bg-white/20 transition-colors shrink-0">
            <i data-lucide="arrow-left" class="w-5 h-5 text-white" aria-hidden="true"></i>
          </button>
          <h2 class="text-white font-bold text-[18px] truncate min-w-0">Anotar Medidas</h2>
          <button type="button" onclick="openOnboarding('medidas')"
            class="min-w-[40px] min-h-[40px] flex items-center justify-center text-white/70 hover:text-white transition-colors shrink-0"
            title="Como funciona esta ferramenta" aria-label="Como funciona esta ferramenta">
            <i data-lucide="graduation-cap" class="w-4.5 h-4.5"></i>
          </button>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="openMeasureModal()" class="fab-inline" title="Inserir medida" aria-label="Inserir medida">
            <i data-lucide="plus" class="w-4 h-4 shrink-0"></i>
            <span>Inserir medida</span>
          </button>
        </div>
      </div>

      <!-- Scrollable content -->
      <div id="measures-scroll-container" class="flex-1 overflow-y-auto pt-3 px-4 pb-4" onscroll="handleScroll(this)">
        <div class="space-y-4 max-w-[440px] mx-auto">

          <!-- Título da seção + Recolher/expandir todos -- logo abaixo do
               header, acima da lista de cards. -->
          <div class="flex items-center justify-between">
            <p id="measures-section-title" class="hidden text-[11px] font-bold text-slate-600 dark:text-dark-muted uppercase tracking-wider">Medidas Inseridas</p>
            <div class="flex items-center gap-3">
              <button id="btn-hide-all-measures" onclick="toggleAllMeasuresVisibility()"
                class="hidden text-[11px] font-bold text-slate-500 hover:text-slate-700 dark:text-slate-500 dark:hover:text-slate-200 transition-colors">
                Ocultar tudo
              </button>
              <button data-collapse-toggle onclick="collapseAllAccordions(document.getElementById('measures-scroll-container'))"
                class="hidden text-[11px] font-bold text-slate-500 hover:text-slate-700 dark:text-slate-500 dark:hover:text-slate-200 transition-colors">
                Recolher todos
              </button>
            </div>
          </div>

          <!-- Onboarding banner (primeira visita) -->
          <div id="onboarding-banner-medidas" class="hidden flex items-start gap-2.5 bg-[#005ca9]/5 dark:bg-blue-900/10 border border-[#005ca9]/20 dark:border-blue-800/30 rounded-2xl p-3.5">
            <i data-lucide="sparkles" class="w-4 h-4 text-[#005ca9] dark:text-blue-300 shrink-0 mt-0.5"></i>
            <div class="flex-1 min-w-0">
              <p class="text-[11px] font-bold text-[#004d8d] dark:text-blue-300">Primeira vez aqui?</p>
              <p class="text-[10px] text-[#004d8d]/80 dark:text-blue-300/80 leading-relaxed mt-0.5">Veja como inserir medidas no canvas.</p>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button type="button" onclick="openOnboarding('medidas', { markSeenOnOpen: true })" class="px-2.5 py-1 bg-[#005ca9] hover:bg-[#004d8d] text-white text-[10px] font-bold rounded-lg transition-colors">Ver agora</button>
              <button type="button" onclick="dismissOnboardingBanner('medidas')" title="Dispensar" aria-label="Dispensar" class="min-w-[40px] min-h-[40px] flex items-center justify-center -mr-[13px] text-[#005ca9]/80 hover:text-[#005ca9] dark:text-blue-300/60 dark:hover:text-blue-300 transition-colors">
                <i data-lucide="x" class="w-4.5 h-4.5"></i>
              </button>
            </div>
          </div>

          <!-- Frame Selector -->
          <div data-frame-selector-card class="bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-line rounded-2xl shadow-sm p-3.5">
            <div class="flex items-center gap-2 mb-2.5">
              <i data-lucide="scan-line" class="w-3.5 h-3.5 text-slate-500 dark:text-dark-muted shrink-0"></i>
              <h4 id="measure-frame-selector-label" class="text-[11px] font-bold text-slate-500 dark:text-dark-muted uppercase tracking-wider">Frames Mapeados</h4>
            </div>
            <div class="relative">
              <select id="measure-frame-selector" onchange="setMeasureActiveFrame(this.value)"
                class="w-full appearance-none text-[12px] bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-dark-line rounded-xl pl-3 pr-9 py-2.5 text-slate-700 dark:text-white outline-none focus:border-[#005ca9]/50 transition-colors">
                <option value="">Sem vínculo (medida avulsa)</option>
              </select>
              <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-gray-500 dark:text-dark-muted absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </div>
            <p id="measure-frame-selector-hint" class="text-[10px] text-slate-500 dark:text-dark-muted mt-2 leading-tight">
              Selecione um frame para focá-lo no canvas e associar esta medida a ele.
            </p>
          </div>

          <!-- Results -->
          <div>
            <div class="flex items-center justify-end gap-3 mb-3">
              <button id="btn-export-measures" onclick="exportMeasurements()"
                class="hidden text-[11px] font-bold text-[#005ca9] dark:text-blue-400 hover:underline flex items-center gap-1">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> Exportar (.md)
              </button>
            </div>
            <!-- Instrução discreta -->
            <div id="hint-measures" class="mb-5 min-h-[76px] p-3 bg-blue-50 dark:bg-blue-900/20 rounded-xl border border-blue-100 dark:border-blue-800/30 flex gap-2">
              <i data-lucide="info" class="w-4 h-4 text-blue-600 dark:text-blue-400 shrink-0 mt-0.5"></i>
              <p class="text-[11px] text-blue-800 dark:text-blue-300 leading-tight">
                Selecione os elementos no canvas e toque no botão <strong>+</strong> no topo para inserir uma medida.
              </p>
            </div>

            <ul id="measurements-results" class="flex flex-col gap-2 min-h-[50px]">
               <!-- List of created items will appear here -->
            </ul>

          </div>

          <!-- Finalizar Registros — ação única de fechamento, tom discreto (outline)
               para não competir com "Inserir medida" no header, a ação mais
               frequente da tela. Só aparece com medidas criadas (ver renderMeasurementsResults). -->
          <div id="btn-finalize-measurements-wrap" class="hidden pt-4 pb-2">
            <button onclick="finalizeSection('measurements')"
              class="w-full flex items-center justify-center gap-2 py-3 bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-line rounded-2xl text-[12px] font-bold text-slate-600 dark:text-dark-muted hover:bg-gray-50 dark:hover:bg-slate-800 hover:border-slate-300 transition-all shadow-sm">
              <i data-lucide="clipboard-check" class="w-4 h-4" aria-hidden="true"></i>
              Finalizar Registros
            </button>
          </div>

        </div>
      </div>

    </main>
